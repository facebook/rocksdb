name: build-folly
description: Build folly and dependencies (skipped if cache hit)
inputs:
  cache-hit:
    description: Whether the folly cache was hit
    required: true
  timeout-seconds:
    description: Maximum time for the folly build command
    required: false
    default: '21600'
runs:
  using: composite
  steps:
  - name: Build folly and dependencies
    if: ${{ inputs.cache-hit != 'true' }}
    run: |
      clean_path=()
      IFS=: read -ra path_entries <<< "$PATH"
      for entry in "${path_entries[@]}"; do
        if [[ "$entry" != "/usr/lib/ccache" ]]; then
          clean_path+=("$entry")
        fi
      done
      export PATH="$(IFS=:; echo "${clean_path[*]}")"
      CI_COMMAND_TIMEOUT_SECONDS=${{ inputs.timeout-seconds }} \
        .github/scripts/run-with-timeout.sh make build_folly
    shell: bash
  - name: Skip folly build (using cached version)
    if: ${{ inputs.cache-hit == 'true' }}
    run: echo "Folly build skipped - using cached version"
    shell: bash
